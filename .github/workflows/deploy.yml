# Build the single-origin image (SPA + API) and deploy it to Azure Container Apps.
#
# Prerequisites (set once, outside this file):
#   Repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#     AZURE_CLIENT_ID          - app registration / user-assigned MI client id (OIDC federated to this repo)
#     AZURE_TENANT_ID          - Entra tenant id
#     AZURE_SUBSCRIPTION_ID    - target subscription id
#     AZURE_RESOURCE_GROUP     - resource group holding the Container App (e.g. rg-fcm)
#     AZURE_CONTAINERAPP_NAME  - the Container App name
#   The federated identity needs Contributor on the resource group.
#   The Container App must be able to pull the GHCR image (public package, or a registry
#   credential configured on the app). App secrets live on the Container App, never here.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference (lowercased owner/repo)
        id: image
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ref }}

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINERAPP_NAME }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "${{ steps.image.outputs.ref }}"
