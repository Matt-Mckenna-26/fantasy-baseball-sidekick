# PR + main gate: lint, typecheck, unit tests, and a full build (which also proves the
# Docker build's compile steps succeed). Keeps main green before deploy.yml runs.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ESLint only for now; Prettier formatting is not yet enforced repo-wide.
      - run: npx eslint .

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
